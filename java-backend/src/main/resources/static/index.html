<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Explorer - FAETEC</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Centraliza na FAETEC Quintino
        const map = L.map('map').setView([-22.8925, -43.3245], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Busca os dados da sua API Java
        fetch('/api/atividades')
            .then(res => res.json())
            .then(atividades => {
                atividades.forEach(atv => {
                    if(atv.latitude && atv.longitude) {
                        L.marker([atv.latitude, atv.longitude])
                            .addTo(map)
                            .bindPopup(`<b>${atv.nome}</b><br>${atv.descricao}`);
                    }
                });
            });
    </script>
</body>
</html>
